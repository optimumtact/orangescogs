<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Discord Print</title>
    <style>
      @page { size: A4; margin: 15mm; }
      body { font-family: sans-serif; color: #1f1f1f; background: white; }
      .message { border: 1px solid #d0d0d0; padding: 12px; margin-bottom: 16px; }
      .message.target { border-left: 5px solid #444; }
      .header { display: flex; align-items: center; gap: 12px; }
      .avatar { width: 40px; height: 40px; border-radius: 50%; }
      .timestamp { color: #666; font-size: 0.8rem; }
      .content { white-space: pre-wrap; line-height: 1.5; }
      .inline-image { max-width: 100%; max-height: 480px; }
    </style>
  </head>
  <body>
    <header># general</header>
    <main>
      <article class="message target">
        <div class="header">
          <img class="avatar" src="avatar.png" alt="avatar" />
          <div>
            <div>Alice</div>
            <div class="timestamp">16 September 2026, 10:42</div>
          </div>
        </div>
        <div class="content">This is a sample message.</div>
      </article>
    </main>
  </body>
</html>
